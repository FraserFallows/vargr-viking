<section id="page-header">
    <h1>Contact Us</h1>
</section>
<section id="contact-section">
    <div class="contact-layout">
        <div class="contact-info">
            <p>Have a question or want to find out more about what we do? Get in touch. We are happy to hear from anyone curious about Vargr Viking.</p>
            <span>Contact us: </span><a href="mailto:info@vargrviking.co.uk">info@vargrviking.co.uk</a>
        </div>
        <form class="contact-form">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" rows="6" required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</section>
